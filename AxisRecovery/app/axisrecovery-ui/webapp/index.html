<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AxisRecovery</title>
  <link rel="icon" type="image/png" href="img/favicon-32.png" />
  <style>
    html, body, #content { height: 100%; margin: 0; }
  </style>
  <script
    id="sap-ui-bootstrap"
    src="https://sdk.openui5.org/resources/sap-ui-core.js"
    data-sap-ui-theme="sap_horizon"
    data-sap-ui-libs="sap.m,sap.f,sap.ui.layout"
    data-sap-ui-compatVersion="edge"
    data-sap-ui-async="true"
    data-sap-ui-frameOptions="trusted"
    data-sap-ui-resource-roots='{"axisrecovery.ui": "./"}'
    data-sap-ui-on-init="module:sap/ui/core/ComponentSupport"
  ></script>
</head>
<body class="sapUiBody" id="content">
  <div
    data-sap-ui-component
    data-name="axisrecovery.ui"
    data-id="container"
    data-settings='{"id" : "axisrecovery"}'
    style="height: 100%;"
  ></div>
</body>
</html>
